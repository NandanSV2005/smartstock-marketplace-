services:
  # Backend Web Service (Django)
  - type: web
    name: smartstock-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd smartstock_backend && python manage.py migrate && python manage.py runserver 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "True"

  # Frontend Static Site (React/Vite)
  - type: web
    runtime: static
    name: smartstock-frontend
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smartstock-backend.onrender.com/api/v1
      - key: VITE_BACKEND_URL
        value: https://smartstock-backend.onrender.com
